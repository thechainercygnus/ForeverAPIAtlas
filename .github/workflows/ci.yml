name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only by default; a job that needs more says so itself.
# Actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits to scan them.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Python and Node come from the runner image. jsonschema is pip-installed into a venv
  # (locally it comes from ../ForeverAPIExplorer/.test-deps). test_import_dump.py's
  # real-dump test skips here: the capture dumps are private and local only.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jsonschema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check jsonschema==4.26.0
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Profile tests
        run: python test_profiles.py -v
      - name: Importer tests
        run: python test_import_dump.py -v
      - name: Compare tests
        run: node --test test_compare.mjs test_items.mjs
