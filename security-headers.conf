# Included at server level and in every location that sets its own headers: a location with any
# add_header stops inheriting the server's. Caddy terminates TLS in front; these pass through it.
#
# The atlas runs its own scripts (including ES modules), fetches its JSON and loads its own fonts,
# all from this origin. It has no inline scripts or styles, eval or third-party resources.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
