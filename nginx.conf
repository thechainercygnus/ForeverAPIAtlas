server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    # The image ships a .gz beside every text file (see Dockerfile); serve those when the
    # client accepts gzip. gzip on covers anything without a precompressed copy.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    # Revalidate everything on each load (cheap with ETag/304), so a deploy never leaves a
    # page running a mix of old and new scripts or data.
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # Font files never change in place: a new font or weight gets a new file name.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ES modules (profile.js imports compare.mjs and items.mjs) only run when served as JavaScript.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
